services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-railcore}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-railcore}
    depends_on:
      db:
        condition: service_healthy
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-railcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-railcore}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      # TCP probe: the socket-only temp server during first-boot init must not count as ready.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

volumes:
  pgdata:
